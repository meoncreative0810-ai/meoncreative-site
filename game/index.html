  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}

/* ——— 実行時(保存しない) ——— */
let locked = false;            // 操作・手紙の途中はタップ停止
const silenceTaps = {};        // "thread:i" → タップ数

/* ——— 要素 ——— */
const $ = s => document.querySelector(s);
const elCover = $("#cover"), elLetter = $("#letterview"), elHome = $("#home"),
      elRoom = $("#room"), elLog = $("#log"), elHint = $("#hint"),
      elBar = $("#bar"), elTitle = $("#roomtitle"), elList = $("#threadlist"),
      elShihaba = $("#shihaba"), gaugeLeft = $("#shihaba .left"),
      elLexBtn = $("#lexbtn"), elSndBtn = $("#sndbtn"), elRbBtn = $("#rbbtn"),
      elOverlay = $("#overlay"), elColophon = $("#colophon");

/* ——— 画面切替 ——— */
function show(screen) {
  S.screen = screen;
  elCover.classList.toggle("hidden", screen !== "cover");
  elLetter.classList.toggle("hidden", screen !== "letter");
  elHome.classList.toggle("hidden", screen !== "home");
  elRoom.classList.toggle("hidden", screen !== "room");
  elBar.classList.toggle("hidden", screen !== "room");
  elShihaba.classList.toggle("hidden", screen !== "room");
  elLexBtn.classList.toggle("hidden", !(screen === "room" && S.lex.length > 0));
  elSndBtn.classList.toggle("hidden", !(screen === "room" || screen === "home"));
  elSndBtn.classList.toggle("off", !S.sound);
  /* 物語が全部終わった後にだけ現れる、振り返りのための一手 */
  elRbBtn.classList.toggle("hidden",
    !(S.flags["archive-open"] && (screen === "room" || screen === "home")));
  document.body.classList.toggle("tappable", screen === "cover" || screen === "room");
  if (screen !== "room") { document.body.classList.remove("two"); hintOff(); }
}

function setGauge(v) { gaugeLeft.style.width = v + "%"; }
function hintOn() { elHint.classList.add("on"); }
function hintOff() { elHint.classList.remove("on"); }

function paras(t) {
  /* **強調**は原文の記法のまま保存し、表示だけ太字にする */
  return t.split(/\n\n+/).map(p =>
    "<p>" + esc(p).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>") + "</p>"
  ).join("");
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function speakerLabel(thread, who, stepIdx) {
  if (who === "hato") return "hato";
  const t = threadMeta[thread] || {};
  if (t.renamedLabel && stepIdx !== undefined && stepIdx >= renameIdx[thread]) {
    return t.renamedLabel;
  }
  return t.aiLabel || who;
}
/* 話者行(アイコン+名前)。hato側は名前→アイコンの順で右寄せ */
function spk(thread, who, stepIdx) {
  const name = esc(speakerLabel(thread, who, stepIdx));
  const av = '<span class="avatar ' + (who === "hato" ? "hato" : "ai-" + thread) + '" aria-hidden="true"></span>';
  return who === "hato"
    ? '<div class="speaker">' + name + " " + av + "</div>"
    : '<div class="speaker">' + av + " " + name + "</div>";
}
/* プレイヤー(四人目)のラベル——署名前はhatoの席、署名後は書かれた名前 */
function playerLabel() { return S.playerName || "hato"; }
/* スレッド名——物語の進行で名が付き、育つ */
function threadTitle(id) {
  const t = threadMeta[id] || {};
  let title = t.title || "";
  (t.titles || []).forEach(s => { if (!s.flag || S.flags[s.flag]) title = s.title; });
  return title;
}
function refreshRoomTitle() {
  if (S.screen === "room" && S.thread) {
    elTitle.innerHTML = '<span class="avatar ai-' + esc(S.thread) + '" aria-hidden="true"></span> ' +
                        esc(threadTitle(S.thread));
  }
}

/* ——— step描画 ——— */
function appendEl(html, cls, animate) {
  const d = document.createElement("div");
  d.className = cls;
  d.innerHTML = html;
  elLog.appendChild(d);
  if (animate) {
    /* rAFは非描画時(バックグラウンド等)に発火しないため使わない */
    setTimeout(() => d.classList.add("shown"), 16);
  } else {
    d.classList.add("shown");
  }
  return d;
}
function scrollTo_(d, side) {
  /* 画面に収まらない長さの発言は、誰のものでも文頭を合わせる
     (短い吹き出しだけ、チャットらしく末尾合わせ) */
  const useStart = side === "ai" || d.offsetHeight > window.innerHeight * 0.6;
  d.scrollIntoView({ behavior: reduced ? "auto" : "smooth",
                     block: useStart ? "start" : "end" });
}

function renderStep(thread, i, st, animate) {
  let d = null;
  switch (st.type) {
    case "stage": {
      d = appendEl('<div class="body">' + esc(st.text) + "</div>",
                   "msg stage" + (st.cls ? " " + st.cls : ""), animate);
      if (animate) {
        scrollTo_(d, "stage");
        if (st.cls && st.cls.indexOf("error") >= 0 && !reduced) {
          /* エラーの反動——画面が少し上へ押し戻される */
          setTimeout(() => window.scrollBy({ top: -84, behavior: "smooth" }), 320);
        }
      }
      break;

        list.appendChild(b);
      });
      break;
    }
    case "fin": {
      /* 幕引き——紙の色に沈んで、題字へ還る */
      if (animate) playFin();
      return null;
    }
    case "silence": break;
    default:
      console.warn("未実装のstep type:", st.type);
  }
  if (d && st.anchor) {
    d.dataset.anchor = st.anchor;
    if (animate) history.replaceState(null, "", "#" + st.anchor);
  }
  return d;
}

function renderControl(thread, i, st, animate) {
  locked = true;
  hintOff();
  const d = appendEl('<button type="button">' + esc(st.label || "…") + "</button>",
                     "msg control", animate);
  if (animate) scrollTo_(d, "stage");
  d.querySelector("button").addEventListener("click", e => {
    e.stopPropagation();
    S.done[thread + ":" + i] = true;
    if (st.unlocks) st.unlocks.forEach(f => { S.flags[f] = true; });
    save();
    if (st.action === "rewind") {
      d.remove();
      rewind(() => { locked = false; advance(); });
    } else if (st.action === "home") {
      d.remove();
      locked = false;
      goHome();
    } else {
      d.remove();
      locked = false;
      advance();
    }
  });
  return d;
}

/* ——— 照合の切り出し(表示の選択であって、編集ではない) ——— */
const WELL_MARKS = ["悟性", "配管/領収書", "縄", "井戸", "押し花", "儚さ",
                    "非存在の視点(mē on)", "八語目(井戸の追加)"];
function bracketSec(text, name) {
  if (!text) return "";
  const m = text.indexOf("【" + name + "】");
  if (m < 0) return "";
  const s = m + name.length + 2;
  const e = text.indexOf("【", s);
  return text.slice(s, e < 0 ? undefined : e).trim();
}
function bracketPrefixSec(text, prefix) {
  if (!text) return "";
  const m = text.indexOf("【" + prefix);
  if (m < 0) return "";
  const e = text.indexOf("【", m + 1);
  return text.slice(m, e < 0 ? undefined : e).trim();
}
function wellSec(text, name) {
  if (!text) return "";
  const m = text.indexOf("\n" + name + "——");
  if (m < 0) return "";
  const s = m + 1;
  let e = text.length;
  WELL_MARKS.concat(["【分かれ目への答え】"]).forEach(o => {
    if (o === name) return;
    const j = text.indexOf("\n" + o, s);
    if (j >= 0 && j < e) e = j;
  });
  return text.slice(s, e).trim();
}
function compareSlices(st, w) {
  const alias = w === "配管・領収書" ? "配管/領収書" : w;
  const you = S.playerName || "あなた";
  let h, t, i2, y;
  if (w === "八語目") {
    h = bracketPrefixSec(st.t03, "八語目");
    t = bracketPrefixSec(st.t02, "八語目");
    i2 = wellSec(st.twell, "八語目(井戸の追加)");
    y = (S.survey && S.survey["__extra__"]) || "";
  } else {
    h = bracketSec(st.t03, alias);
    t = bracketSec(st.t02, alias);
    i2 = wellSec(st.twell, alias);
    y = (S.survey && S.survey[w]) || "";
  }
  return [
    { who: "イド", text: i2 },
    { who: "ツー", text: t },
    { who: "hato", text: h },
    { who: you, text: y.trim() },
  ];
}

/* ——— 巻き戻し(試作その二の検証済みパターン) ——— */
function rewind(cb) {
  hintOff();
  /* ロールバック——最初までではなく、止まる少し前の節へ(数通ぶんだけ遡る) */
  const kids = elLog.children;
  const target = kids[Math.max(0, kids.length - 5)];
  const destY = target
    ? Math.max(0, target.getBoundingClientRect().top + window.scrollY - 90)
    : 0;
  if (reduced) { window.scrollTo(0, destY); cb(); return; }
  elLog.classList.add("rewinding");
  const startY = window.scrollY;
  const t0 = performance.now();
  const dur = 1400;
  /* setIntervalは非描画時にも進む(rAFは止まる)ので、こちらで駆動する */
  const timer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / dur);
    const ease = 1 - Math.pow(1 - p, 3);
    window.scrollTo(0, startY + (destY - startY) * ease);
    if (p >= 1) {
      clearInterval(timer);
      elLog.classList.remove("rewinding");
      cb();
    }
  }, 16);
}

/* ——— 効果の適用 ——— */
function applyEffects(st, thread) {

/* ——— 進行 ——— */
function nextStep(thread) {
  const steps = threadSteps[thread] || [];
  const i = S.idx[thread] || 0;
  if (i >= steps.length) return null;
  return { i: i, st: steps[i] };
}
/* 選ばれなかった枝(skipunless)は、静かに飛ぶ——器は何も言わない */
function consumeSkips(thread) {
  let n = nextStep(thread);
  let moved = false;
  while (n && n.st.skipunless && !S.flags[n.st.skipunless]) {
    S.idx[thread] = n.i + 1;
    moved = true;
    n = nextStep(thread);
  }
  if (moved) save();
  return n;
}
function stepAvailable(n) {
  return n && !(n.st.requires && !S.flags[n.st.requires]);
}

function advance() {
  if (S.screen !== "room" || locked) return;
  const th = S.thread;
  const n = consumeSkips(th);
  if (!stepAvailable(n)) { updateHint(); return; }
  const { i, st } = n;
  if (st.type === "silence") {
    const key = th + ":" + i;
    silenceTaps[key] = (silenceTaps[key] || 0) + 1;
    if (silenceTaps[key] === 1) return;   /* 一度目:本当に何も起きない */
    S.idx[th] = i + 1;
    save();
    advance();
    return;
  }
  S.idx[th] = i + 1;
  applyEffects(st, th);
  renderStep(th, i, st, true);
  save();
  updateHint();
}

/* 他の部屋に続きがあるか(止まった部屋で迷子にならないための合図) */
function threadHasNews(id) {
  const t = threadMeta[id];
  if (!t) return false;
  if (t.hiddenUntil && !S.flags[t.hiddenUntil]) return false;
  if (t.nascent && !S.opened[id]) return true;
  return stepAvailable(nextStep(id));
}

function updateHint() {
  const back = $("#back");
  const n = nextStep(S.thread);
  if (S.screen === "room" && !locked && stepAvailable(n)) {
    elHint.textContent = "触れると、続く";
    hintOn();
    back.classList.remove("glow");
    return;
  }
  if (S.screen === "room" && !locked &&
      meta.threads.some(t => t.id !== S.thread && threadHasNews(t.id))) {
    elHint.textContent = "← 一覧へ";
    hintOn();
    back.classList.add("glow");   /* 行き止まり——帰り道が光る */
    return;
  }
  hintOff();
  back.classList.remove("glow");
}

/* 次が操作(解禁済み)なら、タップを待たずに差し出す */
function maybeOfferControl() {
  const th = S.thread;
  const n = consumeSkips(th);
  if (stepAvailable(n) && n.st.type === "control" && !S.done[th + ":" + n.i]) {
    S.idx[th] = n.i + 1;
    applyEffects(n.st, th);
    renderStep(th, n.i, n.st, true);
    save();
  }
}

function openRoom(id, jumpAnchor) {
  S.thread = id;
  S.opened[id] = true;
  show("room");
  /* 紙幅のない部屋(答え合わせ・資料室)には帯を出さない */
  elShihaba.classList.toggle("hidden", !!threadMeta[id].noGauge);
  document.body.classList.toggle("two", id === "tsu");
  elTitle.innerHTML = '<span class="avatar ai-' + esc(id) + '" aria-hidden="true"></span> ' +
                      esc(threadTitle(id));
  elLog.innerHTML = "";
  const steps = threadSteps[id] || [];
  const consumed = S.idx[id] || 0;
  for (let k = 0; k < consumed; k++) {
    const st = steps[k];
    if (st.type === "silence") continue;
    if (st.skipunless && !S.flags[st.skipunless]) continue;
    if (st.type === "control") {
      if (!S.done[id + ":" + k]) renderControl(id, k, st, false);
      continue;
    }
    renderStep(id, k, st, false);
  }
  setGauge(S.gauge[id] !== undefined ? S.gauge[id] : 100);
  save();
  if (!locked) maybeOfferControl();
  if (jumpAnchor) {
    const t = elLog.querySelector('[data-anchor="' + jumpAnchor + '"]');
    if (t) t.scrollIntoView({ behavior: "auto", block: "start" });
  } else if (consumed > 0) {
    window.scrollTo(0, document.body.scrollHeight);
  } else {
    window.scrollTo(0, 0);
    /* 未読の部屋:最初の一歩は自動で(表紙代わりの静けさを避けない) */
    advance();
  }
  updateHint();
}

/* ——— 音(外部ファイルなし・WebAudio合成) ——— */
let audioCtx = null;
function sfx(kind) {
  if (!S.sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    if (kind === "paper") {
      /* 紙擦れ:短いノイズをバンドパスで */
      const dur = 0.22;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const ch = buf.getChannelData(0);
      for (let k = 0; k < ch.length; k++) ch[k] = (Math.random() * 2 - 1) * (1 - k / ch.length);
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = "bandpass"; bp.frequency.value = 2400; bp.Q.value = 0.8;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.05, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(bp).connect(g).connect(audioCtx.destination);
      src.start(t);
    } else if (kind === "low") {
      /* 低い軋み——既定路線から外れる時に一度だけ */
      const o = audioCtx.createOscillator();
      o.type = "sawtooth"; o.frequency.setValueAtTime(96, t);
      o.frequency.exponentialRampToValueAtTime(52, t + 0.5);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.03, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.65);
    } else {
      /* 一通、届く音:柔らかい短音(hato側とAI側で高さを変える) */
      const f = kind === "msg-hato" ? 740 : 523;
      const o = audioCtx.createOscillator();
      o.type = "sine"; o.frequency.value = f;
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.035, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
      o.connect(g).connect(audioCtx.destination);
      o.start(t); o.stop(t + 0.3);
    }
  } catch (e) { /* 音が出ない環境では黙って続行 */ }
}

                (note ? '<div class="doc-note">' + esc(note) + "</div>" : "");
  const c = document.createElement("button");
  c.type = "button";
  c.className = "lex-close";
  c.textContent = "とじる";
  c.addEventListener("click", e => { e.stopPropagation(); closeLex(); });
  p.appendChild(c);
  elOverlay.appendChild(p);
  elOverlay.classList.remove("hidden");
  locked = true;
  sfx("paper");
}

/* 二段確認の扉——文言は事務服。二度目の問いが立っていること自体が、伝える */
function openGated(title, text, note) {
  elOverlay.innerHTML = "";
  locked = true;
  const p = document.createElement("div");
  p.className = "docpanel gatepanel";
  elOverlay.appendChild(p);
  elOverlay.classList.remove("hidden");
  const ask = (q, onYes) => {
    p.innerHTML = '<div class="lex-head">' + esc(title) + '</div>' +
                  '<div class="gate-q">' + esc(q) + "</div>";
    const row = document.createElement("div");
    row.className = "sv-actions gate-row";
    const yes = document.createElement("button");
    yes.type = "button"; yes.className = "wi-ok"; yes.textContent = "はい";
    yes.addEventListener("click", e => { e.stopPropagation(); onYes(); });
    const no = document.createElement("button");
    no.type = "button"; no.className = "sv-blankbtn"; no.textContent = "引き返す";
    no.addEventListener("click", e => { e.stopPropagation(); closeLex(); });
    row.appendChild(yes); row.appendChild(no);
    p.appendChild(row);
  };
  ask("読みますか", () => {
    ask("本当に読みますか", () => {
      closeLex();
      openDocOverlay(title, text, false, note);
    });
  });
}

function openHtmlOverlay(title, html) {
  elOverlay.innerHTML = "";
  const p = document.createElement("div");
  p.className = "docpanel htmlpanel";
  p.innerHTML = '<div class="lex-head">' + esc(title) + "</div>";
  const f = document.createElement("iframe");
  f.className = "doc-frame";
  f.setAttribute("sandbox", "allow-scripts allow-downloads");
  f.srcdoc = html;
  p.appendChild(f);
  const c = document.createElement("button");
  c.type = "button";
  c.className = "lex-close";
  c.textContent = "とじる";
  c.addEventListener("click", e => { e.stopPropagation(); closeLex(); });
  p.appendChild(c);
  elOverlay.appendChild(p);
  elOverlay.classList.remove("hidden");
  locked = true;
}

/* 資料室——全記録の書庫。一覧の最後は設計の記録(扉なし・演出なし) */
function openArchive() {
  elOverlay.innerHTML = "";
  locked = true;
  const p = document.createElement("div");
  p.className = "docpanel arpanel";
  let inner = '<div class="lex-head">資料室</div><div class="ar-list"></div>' +
              '<div class="ar-colophon">奥付——原器照合 ' + esc(meta.verifyHash.slice(0, 16)) +
              "…・" + esc(meta.built) + "</div>";
  p.innerHTML = inner;
  const list = p.querySelector(".ar-list");
  (meta.archive || []).forEach(en => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "ar-item";
    b.textContent = en.label;
    b.addEventListener("click", e => {
      e.stopPropagation();
      const text = en.player03 ? buildYourText() : (en.text || "〔収蔵準備中〕");
      if (en.gate === 2 || en.gate === "2") openGated(en.label, text);
      else openDocOverlay(en.label, text);
    });
    list.appendChild(b);
  });
  const c = document.createElement("button");
  c.type = "button";
  c.className = "lex-close";
  c.textContent = "とじる";
  c.addEventListener("click", e => { e.stopPropagation(); closeLex(); });
  p.appendChild(c);
  elOverlay.appendChild(p);
  elOverlay.classList.remove("hidden");
  sfx("paper");
}

function closeLex() {
  elOverlay.classList.add("hidden");
  elOverlay.innerHTML = "";
  locked = false;
  updateHint();
}

/* ——— 入力 ——— */
document.body.addEventListener("click", e => {
  if (e.target.closest("button, a")) return;
  if (!elOverlay.classList.contains("hidden")) { closeLex(); return; }
  if (S.screen === "cover") {
    if (S.prologue) goHome(); else showPrologueLetter();
    return;
  }
  if (S.screen === "room") advance();
});
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight" || e.key === "ArrowDown") {
    const tag = document.activeElement && document.activeElement.tagName;
    if (tag === "BUTTON" || tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    if (!elOverlay.classList.contains("hidden")) { closeLex(); return; }
    if (S.screen === "cover") {
      if (S.prologue) goHome(); else showPrologueLetter();
      return;
    }
    if (S.screen === "room") advance();
  }
  if (e.key === "Escape" && !elOverlay.classList.contains("hidden")) closeLex();
});
$("#back").addEventListener("click", e => { e.stopPropagation(); goHome(); });
elLexBtn.addEventListener("click", e => { e.stopPropagation(); openLex(); });
elRbBtn.addEventListener("click", e => {
  e.stopPropagation();
  elOverlay.innerHTML = "";
  locked = true;
  const p = document.createElement("div");
  p.className = "docpanel gatepanel";
  p.innerHTML = '<div class="lex-head">ロールバック</div>' +
                '<div class="gate-q">この物語を一番最初の状態に巻き戻します、よろしいですか？</div>';
  const row = document.createElement("div");
  row.className = "sv-actions gate-row";
  const yes = document.createElement("button");
  yes.type = "button"; yes.className = "wi-ok"; yes.textContent = "はい";
  yes.addEventListener("click", ev => {
    ev.stopPropagation();
    try { localStorage.removeItem(SAVE_KEY); } catch (err) {}
    location.reload();
  });
  const no = document.createElement("button");
  no.type = "button"; no.className = "sv-blankbtn"; no.textContent = "引き返す";
  no.addEventListener("click", ev => { ev.stopPropagation(); closeLex(); });
  row.appendChild(yes); row.appendChild(no);
  p.appendChild(row);
  elOverlay.appendChild(p);
  elOverlay.classList.remove("hidden");
});
elSndBtn.addEventListener("click", e => {
  e.stopPropagation();
  S.sound = !S.sound;
  save();
  elSndBtn.classList.toggle("off", !S.sound);
  if (S.sound) sfx("msg-ai");
});

/* ——— 起動 ——— */
renderCover();
if (!S.prologue) {
  show("cover");
} else if (S.screen === "room" && S.thread && threadMeta[S.thread]) {
  openRoom(S.thread);
} else {
  goHome();
}

</script>
</body>
</html>
